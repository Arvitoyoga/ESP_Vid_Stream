server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.caksa.id;

    ssl_certificate /etc/letsencrypt/live/live.caksa.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.caksa.id/privkey.pem;

    proxy_http_version 1.1;
    proxy_read_timeout 1h;

    location = /ingest {
        # Token kamera ada di URI yang biasanya turut ditulis ke log.
        access_log off;
        error_log /dev/null;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:8081;
    }

    location / {
        # Kirim setiap frame MJPEG segera setelah diterima.
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8081;
    }
}
