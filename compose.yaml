services:
  relay:
    build: ./server
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:?Isi INGEST_TOKEN di .env}
      VIEWER_USER: ${VIEWER_USER:?Isi VIEWER_USER di .env}
      VIEWER_PASS: ${VIEWER_PASS:?Isi VIEWER_PASS di .env}
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8081/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
