<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32-CAM Online</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #151b23;
    --panel-2: #1d2530;
    --line: #2a3441;
    --text: #e8edf3;
    --muted: #8b98a8;
    --accent: #3b9eff;
    --ok: #2ecc71;
    --warn: #ffb020;
    --bad: #ff5d5d;
    --radius: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    padding-top: max(10px, env(safe-area-inset-top));
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.ok  { background: var(--ok);  box-shadow: 0 0 8px var(--ok); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }

  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 12px;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    background: #000;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .stage.fill img { object-fit: cover; }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
    background: rgba(0,0,0,.55);
    transition: opacity .25s;
    pointer-events: none;
  }
  .overlay.hide { opacity: 0; }
  .spinner {
    width: 34px; height: 34px;
    border: 3px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .badge {
    position: absolute;
    left: 10px; top: 10px;
    background: rgba(0,0,0,.6);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    backdrop-filter: blur(4px);
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .group h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--muted);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    flex: 1 1 auto;
    min-width: 64px;
    padding: 10px 12px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .chip small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .chip:hover { border-color: var(--accent); }
  .chip:active { transform: scale(.97); }
  .chip.active { background: rgba(59,158,255,.15); border-color: var(--accent); color: #fff; }
  .chip.active small { color: #a9d3ff; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row + .row { margin-top: 12px; }
  .row .lbl { font-size: 15px; }

  .switch { position: relative; display: inline-block; width: 54px; height: 30px; flex: none; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 2; }
  .slider {
    position: absolute; inset: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    transition: .2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 22px; height: 22px;
    left: 3px; top: 3px;
    background: #cfd8e3;
    border-radius: 50%;
    transition: .2s;
  }
  .switch input:checked + .slider { background: var(--warn); border-color: var(--warn); }
  .switch input:checked + .slider::before { transform: translateX(24px); background: #fff; }

  .btn {
    padding: 8px 14px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:active { transform: scale(.97); }
  .btn.on { background: rgba(59,158,255,.15); border-color: var(--accent); }

  @media (min-width: 900px) {
    main { flex-direction: row; padding: 16px; gap: 16px; }
    .panel { width: 320px; flex: none; overflow-y: auto; }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    header { display: none; }
    main { flex-direction: row; padding: 8px; gap: 8px; }
    .panel { width: 260px; flex: none; overflow-y: auto; padding: 10px; gap: 12px; }
  }

  .stage.pseudo-fs { position: fixed; inset: 0; z-index: 99; border-radius: 0; border: 0; }
  .stage:fullscreen { border-radius: 0; border: 0; }
</style>
</head>
<body>

<header>
  <h1>ESP32-CAM Online</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Menghubungkan...</span></div>
</header>

<main>
  <section class="stage" id="stage">
    <img id="video" alt="Video stream">
    <div class="badge" id="badge">-</div>
    <div class="overlay" id="overlay"><div class="spinner"></div><span id="overlayText">Memuat...</span></div>
  </section>

  <aside class="panel">
    <div class="group">
      <h2>Resolusi</h2>
      <div class="chips" id="chips">
        <button class="chip" data-val="5">QVGA<small>320x240</small></button>
        <button class="chip" data-val="6">CIF<small>400x296</small></button>
        <button class="chip" data-val="8">VGA<small>640x480</small></button>
        <button class="chip" data-val="9">SVGA<small>800x600</small></button>
        <button class="chip" data-val="10">XGA<small>1024x768</small></button>
      </div>
    </div>

    <div class="group">
      <h2>Batas FPS</h2>
      <div class="chips" id="fpsChips">
        <button class="chip" data-val="0">Maks</button>
        <button class="chip" data-val="5">5</button>
        <button class="chip" data-val="10">10</button>
        <button class="chip" data-val="15">15</button>
        <button class="chip" data-val="20">20</button>
      </div>
    </div>

    <div class="group">
      <h2>Kontrol</h2>
      <div class="row">
        <span class="lbl">LED Flash</span>
        <label class="switch">
          <input type="checkbox" id="led">
          <span class="slider"></span>
        </label>
      </div>
      <div class="row">
        <span class="lbl">Tampilan</span>
        <button class="btn" id="fitBtn">Fit</button>
      </div>
      <div class="row">
        <span class="lbl">Layar penuh</span>
        <button class="btn" id="fsBtn">Buka</button>
      </div>
    </div>
  </aside>
</main>

<script>
  const $ = id => document.getElementById(id);
  const video = $('video'), stage = $('stage'), overlay = $('overlay');
  const dot = $('dot'), statusText = $('statusText');
  const RES = { 5: 'QVGA 320x240', 6: 'CIF 400x296', 8: 'VGA 640x480', 9: 'SVGA 800x600', 10: 'XGA 1024x768' };
  let serverDown = false;

  function setStatus(cls, text) { dot.className = 'dot ' + cls; statusText.textContent = text; }
  function showOverlay(text) { overlay.classList.remove('hide'); $('overlayText').textContent = text; }
  function hideOverlay() { overlay.classList.add('hide'); }

  // ----- Stream -----
  function startStream() {
    video.removeAttribute('src');
    video.src = '/stream?t=' + Date.now();
  }
  video.onerror = () => setTimeout(startStream, 2000);

  // ----- Sinkron status dari server -----
  function setActive(containerId, val) {
    document.querySelectorAll('#' + containerId + ' .chip')
      .forEach(c => c.classList.toggle('active', c.dataset.val === String(val)));
  }

  function render(d) {
    const s = d.state;
    setActive('chips', s.res);
    setActive('fpsChips', s.fps);
    $('led').checked = s.led === 1;
    const name = RES[s.res] || '';
    $('badge').textContent = d.fps > 0 ? name + ' · ' + d.fps + ' fps' : name;

    if (!d.online) {
      setStatus('bad', 'ESP32 offline');
      showOverlay('ESP32 belum terhubung ke server...');
    } else if (!d.streaming) {
      setStatus('', 'Menunggu frame');
      showOverlay('Menunggu frame dari ESP32...');
    } else {
      setStatus('ok', 'Live');
      hideOverlay();
    }
  }

  async function poll() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      if (serverDown) { serverDown = false; startStream(); }
      render(d);
    } catch (e) {
      serverDown = true;
      setStatus('bad', 'Server tidak terjangkau');
      showOverlay('Tidak bisa terhubung ke server...');
    }
  }

  async function send(k, v) {
    try {
      const r = await fetch('/api/set?k=' + k + '&v=' + v, { method: 'POST' });
      if (!r.ok) throw new Error(r.status);
      poll();
    } catch (e) {
      setStatus('bad', 'Gagal kirim perintah');
    }
  }

  // ----- Kontrol -----
  $('chips').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    setActive('chips', btn.dataset.val);
    send('res', btn.dataset.val);
  });

  $('fpsChips').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    setActive('fpsChips', btn.dataset.val);
    send('fps', btn.dataset.val);
  });

  $('led').addEventListener('change', e => send('led', e.target.checked ? 1 : 0));

  $('fitBtn').addEventListener('click', e => {
    const fill = stage.classList.toggle('fill');
    e.target.textContent = fill ? 'Fill' : 'Fit';
    e.target.classList.toggle('on', fill);
  });

  function toggleFs() {
    const isFs = document.fullscreenElement || stage.classList.contains('pseudo-fs');
    if (isFs) {
      if (document.fullscreenElement) document.exitFullscreen();
      stage.classList.remove('pseudo-fs');
    } else if (stage.requestFullscreen) {
      stage.requestFullscreen().catch(() => stage.classList.add('pseudo-fs'));
    } else {
      stage.classList.add('pseudo-fs');
    }
  }
  $('fsBtn').addEventListener('click', toggleFs);
  video.addEventListener('dblclick', toggleFs);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') stage.classList.remove('pseudo-fs');
  });

  startStream();
  poll();
  setInterval(poll, 1500);
</script>
</body>
</html>
